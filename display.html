<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prayer Display — Craigavon Masjid</title>
  <meta name="description" content="Full-screen live prayer board for Craigavon Masjid — clock, prayer and jamāʿah times, Hijri date and announcements.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07150f">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/display.css">
</head>
<body>

  <main class="dsp">

    <header class="dsp-header">
      <div class="dsp-brand">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <g fill="none" stroke="#cfa35f" stroke-width="2">
            <rect x="12" y="12" width="24" height="24"/>
            <rect x="12" y="12" width="24" height="24" transform="rotate(45 24 24)"/>
          </g>
          <circle cx="24" cy="24" r="4.5" fill="none" stroke="#faf7f0" stroke-width="2"/>
        </svg>
        <div>
          <h1 class="dsp-brand__en">Craigavon Masjid</h1>
          <div class="dsp-brand__ar" lang="ar">مسجد كريقافن</div>
        </div>
      </div>
      <div class="dsp-jumuah" data-dsp-jumuah></div>
    </header>

    <div class="dsp-centre">
      <div class="dsp-clock-wrap">
        <div class="dsp-clock"><span data-dsp-clock>--:--</span><small data-dsp-seconds>--</small></div>
        <div class="dsp-dates">
          <span data-dsp-gdate></span>
          <span class="hijri" data-dsp-hdate></span>
        </div>
      </div>
      <div class="dsp-next">
        <div class="dsp-next__label">Next prayer</div>
        <div class="dsp-next__name" data-dsp-next-name>…</div>
        <div class="dsp-next__in" data-dsp-next-in>--:--</div>
      </div>
    </div>

    <div class="dsp-grid" data-dsp-grid></div>

    <div class="dsp-announce" data-dsp-announce aria-live="off"></div>

  </main>

  <div class="dsp-hold" data-dsp-hold aria-hidden="true">
    <div>
      <div class="dsp-hold__arabic" lang="ar">حَيَّ عَلَى الصَّلَاةِ</div>
      <div class="dsp-hold__en">Prayer in progress</div>
      <div class="dsp-hold__sub">Please silence your phone · <span lang="ar">سَوُّوا صُفُوفَكُمْ</span></div>
    </div>
  </div>

  <script src="content/config.js" defer></script>
  <script src="content/announcements.js" defer></script>
  <script src="assets/vendor/adhan.umd.min.js" defer></script>
  <script src="assets/js/prayer-times.js" defer></script>
  <script src="assets/js/display.js" defer></script>
</body>
</html>
