name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

jobs:
  quality:
    name: Format, lint, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6

      - name: Set up supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: Unit and integration coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6

      - name: Set up supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and integration tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/lcov.info
            coverage/index.html
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  build:
    name: Production build
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6

      - name: Set up supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production application
        run: pnpm build

  e2e:
    name: Chromium smoke and accessibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect Playwright specifications
        id: specs
        shell: bash
        run: |
          if find tests/e2e -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' \) -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Playwright specifications exist yet; browser checks are skipped without using external credentials."
          fi

      - name: Set up pnpm from package.json
        if: steps.specs.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up supported Node.js
        if: steps.specs.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        if: steps.specs.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.specs.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        if: steps.specs.outputs.present == 'true'
        run: pnpm build

      - name: Run Chromium smoke and axe checks against the production server
        if: steps.specs.outputs.present == 'true'
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: node scripts/start-standalone.mjs
        run: >-
          pnpm exec playwright test --project=chromium-mobile --project=chromium-tablet
          --project=chromium-desktop --project=tv-1080p

      - name: Upload Playwright diagnostics
        if: failure() && steps.specs.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  links:
    name: Internal link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check repository-local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --exclude-path node_modules --exclude-path .next './**/*.md'
            './**/*.html'
          fail: true

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6

      - name: Set up supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production and development dependencies
        run: pnpm audit --audit-level=high

      - name: Review dependency changes in this pull request
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commits and working tree with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  migrations:
    name: Local Supabase migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect local Supabase migrations
        id: migrations
        shell: bash
        run: |
          if [[ -f supabase/config.toml ]] && find supabase/migrations -type f -name '*.sql' -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No local Supabase migration set exists; migration lint is skipped."
          fi

      - name: Set up pinned Supabase CLI
        if: steps.migrations.outputs.present == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Start isolated local Supabase stack
        if: steps.migrations.outputs.present == 'true'
        run: bash scripts/database/start-local-supabase.sh

      - name: Reapply migrations and seed from a clean state
        if: steps.migrations.outputs.present == 'true'
        run: supabase db reset

      - name: Lint local database schema
        if: steps.migrations.outputs.present == 'true'
        run: supabase db lint --local --level warning --fail-on warning

      - name: Prove RLS, roles, seeds, constraints, indexes, and publication workflows
        if: steps.migrations.outputs.present == 'true'
        run: supabase test db

      - name: Repeat clean replay and prove seed determinism
        if: steps.migrations.outputs.present == 'true'
        run: |
          supabase db reset
          supabase test db

      - name: Prove local Auth invitation, revocation, disable, and recovery lifecycle
        if: steps.migrations.outputs.present == 'true'
        run: bash scripts/database/verify-local-auth.sh

      - name: Rehearse logical backup and restore with realistic data
        if: steps.migrations.outputs.present == 'true'
        run: bash scripts/database/verify-backup-restore.sh

      - name: Stop isolated local Supabase
        if: always() && steps.migrations.outputs.present == 'true'
        continue-on-error: true
        run: supabase stop --no-backup

  local-demo:
    name: Clean local product acceptance
    needs: [build, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6

      - name: Set up supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build a clean local database, authentication and demo environment
        run: pnpm setup:local

      - name: Build production application against the clean demo environment
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated local product acceptance
        env:
          LOCAL_DEMO_E2E: 1
          PLAYWRIGHT_DISABLE_VIDEO: 1
          PLAYWRIGHT_WEB_SERVER_COMMAND: node scripts/start-standalone.mjs
        run: >-
          pnpm exec playwright test tests/e2e/local-demo-acceptance.spec.ts
          --project=chromium-desktop --workers=1

      - name: Upload local acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-product-acceptance-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: false

      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: pnpm exec supabase stop --no-backup
